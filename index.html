<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E8A">
<title>Caderneta da Família</title>
<style>
:root{--bg:#E8F5F3;--card:#fff;--ink:#12302E;--mute:#5A7370;--line:#CFE5E1;--p:#0E8F8A;--p2:#0B6E8A;--late:#C62F3B;--soon:#B56E00;--ok:#1F8F55;--fut:#5F7F7B;--none:#6B6F8A;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#0D1B1A;--card:#152624;--ink:#E3F2F0;--mute:#93B3AF;--line:#25403D;--p:#3CC9C1;--p2:#2C9BBF;--late:#FF7C86;--soon:#F0B040;--ok:#5CCB90;--fut:#8FB0AC;--none:#A0A5C8}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#app{max-width:560px;margin:0 auto}button{font:inherit;color:inherit;cursor:pointer}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0B6E8A,#12A596);color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 70px;border-radius:0 0 32px 32px}
.hero h1{margin:2px 0 6px;font-size:27px;letter-spacing:-.02em;max-width:70%}.hero p{margin:0;opacity:.92;max-width:68%;font-size:15px}
.hero svg.art{position:absolute;right:-8px;top:14px;width:46%;max-width:210px}
.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.alert{margin:-44px 16px 0;position:relative;background:var(--card);border:2px solid var(--late);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:600;width:calc(100% - 32px);text-align:left}
.alert.good{border-color:var(--ok)}
h2{font-size:18px;margin:24px 18px 10px}
.fam{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 8px;scroll-snap-type:x mandatory}
.pc{flex:0 0 138px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 10px;text-align:center;position:relative}
.pc .nm{font-weight:700;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc .ag{font-size:13px;color:var(--mute)}
.pc.add{display:flex;flex-direction:column;justify-content:center;align-items:center;border:2px dashed var(--p);color:var(--p);font-weight:700;gap:6px;background:none}
.ringw{position:relative;width:84px;height:84px;margin:0 auto}.ringw svg.r{position:absolute;inset:0}.ringw .a{position:absolute;inset:9px}
.pct{position:absolute;right:-6px;bottom:-4px;background:var(--p);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:2px 7px}
.badge{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.late{--c:var(--late)}.soon{--c:var(--soon)}.ok{--c:var(--ok)}.fut{--c:var(--fut)}.none{--c:var(--none)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:10px 12px;margin:0 16px 8px;text-align:left;width:calc(100% - 32px)}
.ico{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,transparent);display:grid;place-items:center;font-size:22px}
.t1{font-weight:700}.t2{font-size:13px;color:var(--mute)}.right{text-align:right;font-size:13px;color:var(--mute)}.mini{width:22px;height:22px;vertical-align:middle;margin-right:4px}
.btn{margin-top:6px;border:1px solid var(--p);color:var(--p);background:none;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 6px;text-align:center;font-weight:600;font-size:14px}.tile i{display:block;font-style:normal;font-size:30px;margin-bottom:4px}
.tip{margin:0 16px 10px;background:linear-gradient(135deg,#FFF3D6,#FFE4B8);color:#4A3200;border-radius:18px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.tip i{font-style:normal;font-size:34px}.tip b{display:block;margin-bottom:2px}
.card{margin:0 16px 10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px}.card i{font-style:normal;font-size:30px}
.small{color:var(--mute);font-size:13px;margin:16px 20px}
.bar{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 4px}
.back{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700}
.ph{text-align:center;padding:6px 16px}.ph h1{margin:8px 0 0;font-size:24px}.ph .ringw{width:112px;height:112px}.ph .a{inset:12px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 16px}.acts .btn{margin:0}.acts .del{border-color:var(--late);color:var(--late)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:560px}nav button{flex:1;background:none;border:0;padding:10px 4px;font-size:12px;font-weight:600;color:var(--mute)}nav button i{display:block;font-style:normal;font-size:22px}nav button.on{color:var(--p)}
dialog{border:0;border-radius:20px;padding:20px;width:min(92vw,420px);background:var(--card);color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-weight:600;margin:12px 0 6px}input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.avs{display:flex;gap:6px;flex-wrap:wrap}.avs input{display:none}.avs label{margin:0;border:3px solid transparent;border-radius:50%;line-height:0;cursor:pointer}.avs input:checked+label{border-color:var(--p)}
.drow{display:flex;gap:8px;margin-top:18px}.drow button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:none;font-weight:700}.drow .pri{background:var(--p);border-color:var(--p);color:#fff}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<nav><div><button data-a="tab" data-t="home"><i>🏠</i>Início</button><button data-a="tab" data-t="cal"><i>📅</i>Calendário</button><button data-a="tab" data-t="tips"><i>💡</i>Dicas</button></div></nav>
<dialog id="dAdd"><form id="fAdd"><b style="font-size:18px">Nova pessoa</b>
<label for="nm">Nome</label><input id="nm" required maxlength="30" autocomplete="off" placeholder="Ex.: Maria">
<label for="bd">Data de nascimento</label><input id="bd" type="date" required>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="gs" style="width:auto"> Está grávida?</label><div id="gw" hidden><label for="gk">Semanas de gestação hoje</label><input id="gk" type="number" min="1" max="42" inputmode="numeric"></div>
<label>Escolha o personagem</label><div class="avs" id="avs"></div>
<div class="drow"><button type="button" id="cAdd">Cancelar</button><button class="pri" type="submit">Salvar</button></div></form></dialog>
<dialog id="dDose"><form id="fDose"><b style="font-size:18px" id="dTit">Registrar dose</b>
<label for="dd">Data em que foi tomada</label><input id="dd" type="date" required>
<div class="drow"><button type="button" id="cDose">Cancelar</button><button class="pri" type="submit">Salvar</button></div></form></dialog>
<script src="app.js"></script>
</body>
</html>
